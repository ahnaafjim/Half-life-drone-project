; PlatformIO config (optional - the Arduino IDE works too, see firmware/README.md)
[env:esp32_fc_rev1]
platform    = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board       = esp32dev                   ; generic ESP32 module (WROOM-32E-H4: 4 MB flash, no PSRAM)
framework   = arduino
src_dir     = bringup
monitor_speed  = 115200
upload_speed   = 460800
lib_deps =
    adafruit/Adafruit LSM6DS @ 4.7.4
    adafruit/Adafruit BMP3XX Library @ 2.1.6
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
